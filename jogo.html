<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Docker Battle 🐳</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --cyan: #00d4ff;
    --green: #00ff9d;
    --yellow: #ffd600;
    --red: #ff4d6d;
    --text: #e2e8f0;
    --muted: #64748b;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  /* ── HEADER ── */
  header {
    text-align: center;
    padding: 1.5rem;
    background: rgba(10,14,26,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    z-index: 10;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
  }
  h1 {
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-shadow: 0 0 20px rgba(0,212,255,0.4);
  }
  h1 span { color: var(--cyan); }

  /* ── LAYOUT PRINCIPAL ── */
  .battle-arena {
    display: flex;
    flex: 1;
    z-index: 1;
    padding: 2rem;
    gap: 2rem;
    max-width: 1600px;
    margin: 0 auto;
    width: 100%;
  }

  /* ── PLACAR (LATERAL) ── */
  .scoreboard {
    width: 350px;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    justify-content: center;
  }
  .team-card {
    background: var(--surface);
    border: 2px solid;
    border-radius: 16px;
    padding: 2rem 1.5rem;
    text-align: center;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
  }
  
  /* Efeito de Turno Ativo */
  .team-card:not(.active-turn) {
    opacity: 0.4;
    transform: scale(0.95);
  }
  .team-card.active-turn {
    transform: scale(1.05);
    border-width: 3px;
    box-shadow: 0 0 30px currentColor;
  }

  .team-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,0.05));
  }
  .team-name { font-size: 1.4rem; font-weight: 800; margin-bottom: 1rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .team-score { font-size: 4rem; font-weight: 800; font-family: var(--font-mono); line-height: 1; }
  
  /* Cores das Equipes (Reduzidas para 3) */
  .team-containers { border-color: var(--cyan); color: var(--cyan); }
  .team-dockerfiles { border-color: var(--green); color: var(--green); }
  .team-images { border-color: var(--yellow); color: var(--yellow); }

  /* ── ÁREA DA PERGUNTA ── */
  .question-board {
    flex: 1;
    background: rgba(17, 24, 39, 0.7);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    backdrop-filter: blur(10px);
    position: relative;
  }

  /* Indicador de Turno */
  .turn-indicator {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 800;
    margin-bottom: 2rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    background: var(--surface2);
    padding: 1rem;
    border-radius: 12px;
    border: 1px solid var(--border);
  }

  /* Cronômetro */
  .timer-container {
    position: absolute; top: 2rem; right: 3rem;
    display: flex; align-items: center; gap: 1rem;
  }
  .timer-text { font-size: 2.5rem; font-family: var(--font-mono); font-weight: 800; color: var(--cyan); }
  .timer-bar-bg { width: 200px; height: 10px; background: var(--surface2); border-radius: 5px; overflow: hidden; }
  .timer-bar { height: 100%; background: var(--cyan); width: 100%; transition: width 1s linear, background-color 0.3s; }

  .round-info { font-family: var(--font-mono); color: var(--cyan); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; font-size: 1.2rem; }
  .question-text { font-size: 2.2rem; font-weight: 800; line-height: 1.3; margin-bottom: 3rem; }
  
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
  .option-btn {
    background: var(--surface); border: 2px solid var(--border);
    border-radius: 12px; padding: 1.5rem; font-size: 1.2rem;
    color: var(--text); cursor: pointer; transition: all 0.2s;
    font-family: var(--font-display); text-align: left;
    display: flex; align-items: center; gap: 1rem;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--cyan); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,212,255,0.1); }
  .option-btn.correct { border-color: var(--green); background: rgba(0,255,157,0.15); color: var(--green); box-shadow: 0 0 20px rgba(0,255,157,0.3); }
  .option-btn.wrong { border-color: var(--red); background: rgba(255,77,109,0.15); color: var(--red); opacity: 0.7; }
  .option-btn:disabled { cursor: not-allowed; }

  .opt-letter {
    width: 40px; height: 40px; border-radius: 8px; background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 800; font-size: 1.2rem;
  }
  .option-btn.correct .opt-letter { background: var(--green); color: #000; }
  .option-btn.wrong .opt-letter { background: var(--red); color: #fff; }

  .feedback-msg { font-size: 1.3rem; font-weight: 700; margin-bottom: 2rem; min-height: 1.5em; color: var(--green); text-align: center; }

  .controls { display: flex; justify-content: center; margin-top: auto; }
  .btn-primary {
    background: var(--cyan); color: #000; border: none;
    padding: 1rem 3rem; border-radius: 10px; font-size: 1.2rem;
    font-weight: 800; font-family: var(--font-display); cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(0,212,255,0.4);
    display: none;
  }
  .btn-primary:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0,212,255,0.6); }

  /* Tela de Fim de Jogo */
  #end-screen { display: none; text-align: center; }
  .winner-trophy { font-size: 8rem; animation: float 3s ease-in-out infinite; margin-bottom: 1rem; display: inline-block; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
  .winner-name { font-size: 4rem; font-weight: 800; text-transform: uppercase; margin-bottom: 1rem; }

</style>
</head>
<body>

<canvas id="particles"></canvas>

<header>
  <h1>🏆 Docker <span>Battle</span> 🐳</h1>
</header>

<main class="battle-arena">
  
  <aside class="scoreboard" id="scoreboard">
    </aside>

  <section class="question-board" id="game-board">
    
    <div class="turn-indicator" id="turn-indicator">
      VEZ DA EQUIPE: <span id="current-team-name">...</span>
    </div>

    <div class="timer-container" id="timer-ui">
      <div class="timer-bar-bg"><div class="timer-bar" id="timer-bar"></div></div>
      <div class="timer-text" id="timer-text">15</div>
    </div>

    <div class="round-info" id="round-info">Rodada 1 / 12</div>
    <h2 class="question-text" id="q-text">Carregando pergunta...</h2>
    
    <div class="options-grid" id="options-container">
      </div>

    <div class="feedback-msg" id="feedback"></div>

    <div class="controls">
      <button class="btn-primary" id="next-btn" onclick="nextQuestion()">Próxima Rodada ➔</button>
    </div>
  </section>

  <section class="question-board" id="end-screen">
    <span class="winner-trophy">🏆</span>
    <h2 style="font-size: 2rem; color: var(--muted); margin-bottom: 1rem;">O Grande Campeão é:</h2>
    <div class="winner-name" id="winner-name">Team Name</div>
    <p style="font-size: 1.5rem; color: var(--cyan); margin-bottom: 3rem;" id="winner-score">0 Pontos</p>
    <button class="btn-primary" style="display: inline-block;" onclick="location.reload()">Jogar Novamente 🔄</button>
  </section>

</main>

<script>
/* ── CONFIGURAÇÃO DO JOGO ── */
// 3 Equipes agora!
const equipes = [
  { id: "Containers", nome: "Containers", cor: "var(--cyan)", classe: "team-containers" },
  { id: "Dockerfiles", nome: "Dockerfiles", cor: "var(--green)", classe: "team-dockerfiles" },
  { id: "Images", nome: "Images", cor: "var(--yellow)", classe: "team-images" }
];

let pontuacoes = {
  "Containers": 0,
  "Dockerfiles": 0,
  "Images": 0
};

// Banco Expandido: 12 Perguntas (4 rodadas exatas para cada uma das 3 equipes)
const perguntas = [
  {
    pergunta: "Qual comando cria uma imagem Docker a partir de um Dockerfile?",
    opcoes: ["docker run", "docker build", "docker create", "docker compose"],
    correta: "docker build",
    feedback: "Correto! `docker build` usa as instruções do Dockerfile para montar a imagem."
  },
  {
    pergunta: "Qual comando lista apenas os containers que estão em execução neste momento?",
    opcoes: ["docker images", "docker list", "docker ps", "docker status"],
    correta: "docker ps",
    feedback: "Isso mesmo! `docker ps` mostra os containers ativos. Para ver os parados, usamos `docker ps -a`."
  },
  {
    pergunta: "O que é um Dockerfile?",
    opcoes: ["Um container pronto para uso", "Uma máquina virtual leve", "Um arquivo com instruções para criar imagens", "O painel de controle do Docker"],
    correta: "Um arquivo com instruções para criar imagens",
    feedback: "Perfeito! É a nossa 'receita de bolo' automatizada."
  },
  {
    pergunta: "Qual o propósito principal de um 'Volume' no Docker?",
    opcoes: ["Aumentar a memória RAM do container", "Persistir dados mesmo se o container for destruído", "Melhorar a qualidade do som na aplicação", "Compactar a imagem Docker"],
    correta: "Persistir dados mesmo se o container for destruído",
    feedback: "Exato! Volumes garantem que dados importantes (como bancos de dados) não sejam perdidos."
  },
  {
    pergunta: "Qual ferramenta oficial é usada para orquestrar múltiplos containers localmente (ex: app + banco)?",
    opcoes: ["Docker Hub", "Docker Compose", "Docker Swarm", "Docker Multi"],
    correta: "Docker Compose",
    feedback: "Correto! O Docker Compose usa um arquivo YAML para subir todos os serviços juntos."
  },
  {
    pergunta: "O que faz a flag '-d' no comando `docker run -d nginx`?",
    opcoes: ["Deleta o container após o uso", "Faz o download da imagem", "Roda o container em background (Detached)", "Define uma porta padrão"],
    correta: "Roda o container em background (Detached)",
    feedback: "Isso aí! Detached mode libera o seu terminal enquanto o container continua rodando."
  },
  {
    pergunta: "Qual comando remove um container que está parado?",
    opcoes: ["docker rm", "docker rmi", "docker delete", "docker drop"],
    correta: "docker rm",
    feedback: "Correto! `docker rm` remove containers. Para remover imagens, usamos `docker rmi`."
  },
  {
    pergunta: "O que é o Docker Hub?",
    opcoes: ["Um tipo de switch de rede", "Uma IDE para programar em Docker", "Um repositório público na nuvem para compartilhar imagens", "O kernel do Linux modificado"],
    correta: "Um repositório público na nuvem para compartilhar imagens",
    feedback: "Perfeito! É de lá que baixamos imagens oficiais usando `docker pull`."
  },
  {
    pergunta: "Como visualizar o texto que um container está imprimindo no console?",
    opcoes: ["docker print", "docker logs", "docker view", "docker show"],
    correta: "docker logs",
    feedback: "Correto! `docker logs <id-do-container>` mostra tudo que aconteceu no terminal dele."
  },
  {
    pergunta: "Containers são muito mais leves que Máquinas Virtuais porque:",
    opcoes: ["Eles não têm arquivos dentro deles", "Eles usam um SO Windows compactado", "Eles compartilham o Kernel do Sistema Operacional hospedeiro", "Eles só rodam em linguagem C"],
    correta: "Eles compartilham o Kernel do Sistema Operacional hospedeiro",
    feedback: "Exato! O isolamento ocorre sem a necessidade de um SO inteiro duplicado."
  },
  {
    pergunta: "Qual comando você usaria para parar graciosamente um container em execução?",
    opcoes: ["docker kill", "docker stop", "docker pause", "docker halt"],
    correta: "docker stop",
    feedback: "Isso mesmo! O `stop` dá um tempo para a aplicação salvar o que precisa antes de desligar."
  },
  {
    pergunta: "Qual instrução dentro do Dockerfile expõe a porta de rede da aplicação?",
    opcoes: ["PORT", "NETWORK", "OPEN", "EXPOSE"],
    correta: "EXPOSE",
    feedback: "Perfeito! `EXPOSE 80` documenta que o container escuta na porta 80."
  }
];

/* ── VARIÁVEIS DE ESTADO ── */
let currentQIndex = 0;
let currentTeamIndex = 0; // Controla de quem é a vez
let timerInterval;
let timeLeft = 15;
let answered = false;

/* ── INICIALIZAÇÃO ── */
function initGame() {
  renderScoreboard();
  loadQuestion();
}

function renderScoreboard() {
  const board = document.getElementById('scoreboard');
  board.innerHTML = equipes.map((eq, index) => `
    <div class="team-card ${eq.classe} ${index === currentTeamIndex ? 'active-turn' : ''}">
      <div class="team-name">${eq.nome}</div>
      <div class="team-score" id="score-${eq.id}">${pontuacoes[eq.id]}</div>
    </div>
  `).join('');
}

function loadQuestion() {
  clearInterval(timerInterval);
  answered = false;
  timeLeft = 15;
  
  // Atualiza UI geral
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('feedback').textContent = '';
  document.getElementById('timer-ui').style.opacity = '1';
  updateTimerUI();

  // Define de quem é a vez na tela principal
  const currentTeam = equipes[currentTeamIndex];
  const teamNameSpan = document.getElementById('current-team-name');
  teamNameSpan.textContent = currentTeam.nome;
  teamNameSpan.style.color = currentTeam.cor;
  
  // Atualiza Placar para destacar a equipe
  renderScoreboard();

  // Carrega Pergunta
  const q = perguntas[currentQIndex];
  document.getElementById('round-info').textContent = `Rodada ${currentQIndex + 1} de ${perguntas.length}`;
  document.getElementById('q-text').textContent = q.pergunta;

  const optsContainer = document.getElementById('options-container');
  optsContainer.innerHTML = q.opcoes.map((opt, i) => `
    <button class="option-btn" onclick="checkAnswer(this, '${opt.replace(/'/g, "\\'")}')">
      <span class="opt-letter">${['A','B','C','D'][i]}</span> 
      ${opt}
    </button>
  `).join('');

  startTimer();
}

/* ── CRONÔMETRO ── */
function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timeOut();
    }
  }, 1000);
}

function updateTimerUI() {
  const tText = document.getElementById('timer-text');
  const tBar = document.getElementById('timer-bar');
  tText.textContent = timeLeft;
  tBar.style.width = `${(timeLeft / 15) * 100}%`;
  
  if(timeLeft <= 5) {
    tText.style.color = 'var(--red)';
    tBar.style.backgroundColor = 'var(--red)';
  } else {
    tText.style.color = 'var(--cyan)';
    tBar.style.backgroundColor = 'var(--cyan)';
  }
}

function timeOut() {
  if (answered) return;
  answered = true;
  document.getElementById('feedback').innerHTML = "⏰ Tempo Esgotado! <strong>Nenhum ponto.</strong>";
  document.getElementById('feedback').style.color = "var(--red)";
  revealAnswers();
}

/* ── LÓGICA DE RESPOSTA AUTOMÁTICA ── */
function checkAnswer(btnEl, selectedOpt) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);
  
  const q = perguntas[currentQIndex];
  const currentTeam = equipes[currentTeamIndex];
  const isCorrect = (selectedOpt === q.correta);

  if (isCorrect) {
    // Adiciona 10 pontos automaticamente para a equipe da vez!
    pontuacoes[currentTeam.id] += 10; 
    
    document.getElementById('feedback').innerHTML = `🎉 Correto! <strong>+10 Pontos</strong> para a equipe ${currentTeam.nome}! <br> <span style="font-size: 1rem; color: var(--muted);">${q.feedback}</span>`;
    document.getElementById('feedback').style.color = "var(--green)";
    
    // Anima o placar da equipe que ganhou ponto
    renderScoreboard();
    const activeCard = document.querySelector('.team-card.active-turn');
    if(activeCard) {
      activeCard.style.transform = 'scale(1.15)';
      setTimeout(() => activeCard.style.transform = 'scale(1.05)', 300);
    }

  } else {
    document.getElementById('feedback').innerHTML = `❌ Errou! <strong>0 Pontos.</strong> A resposta certa era: <strong>${q.correta}</strong>`;
    document.getElementById('feedback').style.color = "var(--red)";
  }

  revealAnswers(selectedOpt);
}

function revealAnswers(selectedOpt = null) {
  const q = perguntas[currentQIndex];
  const btns = document.querySelectorAll('.option-btn');
  
  btns.forEach(btn => {
    btn.disabled = true;
    const cleanBtnText = btn.innerHTML.split('</span>')[1].trim();

    if (cleanBtnText === q.correta) {
      btn.classList.add('correct');
    } else if (cleanBtnText === selectedOpt) {
      btn.classList.add('wrong');
    }
  });

  const nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = currentQIndex < perguntas.length - 1 ? 'Próxima Rodada ➔' : 'Ver Campeão 🏆';
  nextBtn.style.display = 'inline-block';
  document.getElementById('timer-ui').style.opacity = '0.3';
}

function nextQuestion() {
  // Passa o turno para a próxima equipe
  currentTeamIndex = (currentTeamIndex + 1) % equipes.length;
  currentQIndex++;
  
  if (currentQIndex < perguntas.length) {
    loadQuestion();
  } else {
    endGame();
  }
}

/* ── FIM DE JOGO ── */
function endGame() {
  document.getElementById('game-board').style.display = 'none';
  document.getElementById('end-screen').style.display = 'block';

  // Descobrir Vencedor
  let maxScore = -1;
  let winnerId = '';
  
  Object.keys(pontuacoes).forEach(equipe => {
    if(pontuacoes[equipe] > maxScore) {
      maxScore = pontuacoes[equipe];
      winnerId = equipe;
    }
  });

  const winnerObj = equipes.find(e => e.id === winnerId);
  const winNameEl = document.getElementById('winner-name');
  
  // Trata empate
  let vencedores = Object.keys(pontuacoes).filter(eq => pontuacoes[eq] === maxScore);
  
  if(vencedores.length > 1) {
    winNameEl.textContent = "Empate!";
    winNameEl.style.color = "var(--text)";
    winNameEl.style.textShadow = `0 0 30px var(--text)`;
  } else {
    winNameEl.textContent = "Equipe " + winnerObj.nome;
    winNameEl.style.color = winnerObj.cor;
    winNameEl.style.textShadow = `0 0 30px ${winnerObj.cor}`;
  }
  
  document.getElementById('winner-score').textContent = `${maxScore} Pontos!`;
}

/* ── PARTICULAS (FUNDO) ── */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H, pts = [];
function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
function initPts(){
  pts=[];
  for(let i=0;i<50;i++) pts.push({
    x:Math.random()*W, y:Math.random()*H,
    vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3,
    r:Math.random()*2, o:Math.random()*0.3+0.1
  });
}
function drawPts(){
  ctx.clearRect(0,0,W,H);
  pts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>W) p.vx*=-1;
    if(p.y<0||p.y>H) p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${p.o})`; ctx.fill();
  });
  requestAnimationFrame(drawPts);
}
resize(); initPts(); drawPts();
window.addEventListener('resize',()=>{ resize(); initPts(); });

// Inicia
initGame();
</script>
</body>
</html>
